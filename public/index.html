<!-- © 2026 The Movement AI -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Movement AI</title>
  <style>
    :root {
      --ink: #1A1A1A;
      --paper: #F5EFE4;
      --paper-deep: #EFE7D6;
      --rust: #A0442C;
      --rust-deep: #7A3320;
      --muted: #6B6355;
      --divider: #D4C9B4;

      /* Supplementary warm-toned semantic accents — not in the core 7, but needed to keep report
         cards distinguishable (success / warning / alert) without reaching for purple or cold gray. */
      --success: #5C7A4A;
      --warn: #A6790F;
      --flag: #8C3B27;

      --radius: 4px;
      --font: Cambria, Georgia, serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 80px;
      gap: 20px;
    }

    /* ── Header ── */
    header { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    header .logo-img { height: 80px; width: auto; display: block; }
    header .logo-fallback {
      font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; color: var(--ink);
      display: none;
    }
    header .brand-subtitle {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--muted);
    }
    header p.tagline { font-size: 0.82rem; color: var(--muted); }

    /* ── Mode Selector ── */
    .mode-selector-wrap {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .mode-selector-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0 2px;
    }
    .mode-selector {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      background: var(--paper-deep);
      border: 1px solid var(--divider);
      border-radius: var(--radius);
      padding: 6px;
    }
    .mode-btn {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 5px;
      padding: 14px 14px;
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
      background: transparent;
      text-align: left;
      white-space: normal;
      min-width: 0;
    }
    .mode-btn:hover:not(.active) { background: var(--paper); }
    .mode-btn.active {
      background: var(--rust);
    }
    .mode-btn-icon {
      font-size: 1.2rem;
      line-height: 1;
    }
    .mode-btn-title {
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--ink);
      transition: color 0.2s;
    }
    .mode-btn.active .mode-btn-title { color: var(--paper); }
    .mode-btn-desc {
      font-size: 0.7rem;
      color: var(--muted);
      line-height: 1.4;
      transition: color 0.2s;
    }
    .mode-btn.active .mode-btn-desc { color: rgba(245,239,228,0.8); }

    /* ── Upload ── */
    #uploadArea {
      position: relative;
      overflow: hidden;
      border: 2px dashed var(--divider);
      border-radius: var(--radius);
      padding: 40px 32px;
      text-align: center;
      cursor: pointer;
      width: 100%;
      max-width: 640px;
      transition: border-color 0.18s, background 0.18s;
      user-select: none;
    }
    #uploadArea:hover, #uploadArea.drag-over { border-color: var(--rust); background: rgba(160,68,44,0.05); }
    #uploadArea .playbook-decoration { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.12; pointer-events: none; z-index: 0; }
    #uploadArea > *:not(.playbook-decoration) { position: relative; z-index: 1; }
    #uploadArea .icon { font-size: 2rem; margin-bottom: 12px; }
    #uploadArea .label { font-size: 0.88rem; color: var(--muted); }
    #uploadArea .label strong { color: var(--ink); }
    #uploadArea .hint { margin-top: 7px; font-size: 0.73rem; color: var(--muted); }
    #fileInput { display: none; }

    /* ── Status ── */
    #statusBar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 16px;
      background: var(--paper-deep);
      border: 1px solid var(--divider);
      border-radius: var(--radius);
      font-size: 0.78rem;
      color: var(--muted);
      width: 100%;
      max-width: 640px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--divider); }
    .dot.loading { background: var(--warn); }
    .dot.ready   { background: var(--success); }
    .dot.active  { background: var(--rust); }
    .dot.error   { background: var(--flag); }
    #fpsBadge { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); }
    #trackingBadge { color: var(--warn); font-size: 0.75rem; }

    /* ── Video ── */
    #videoWrap { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 900px; gap: 12px; }
    #videoWrap.visible { display: flex; }
    #outputCanvas { width: 100%; border-radius: var(--radius); background: var(--ink); display: block; }
    #outputCanvas.awaiting-selection { cursor: pointer; }
    #video { display: none; }

    .seek-row { display: flex; align-items: center; gap: 10px; width: 100%; }
    #seekBar {
      flex: 1; height: 4px; -webkit-appearance: none; appearance: none;
      background: var(--divider); border-radius: 2px; outline: none; cursor: pointer;
    }
    #seekBar::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--rust); cursor: pointer; }
    #timeDisplay { font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

    .controls { display: flex; align-items: center; gap: 10px; width: 100%; flex-wrap: wrap; }

    button {
      font-family: var(--font);
      padding: 7px 18px; border-radius: var(--radius); border: none; cursor: pointer;
      font-size: 0.82rem; font-weight: 500; transition: background 0.15s, opacity 0.15s; white-space: nowrap;
    }
    button:disabled { opacity: 0.4; cursor: default; }
    .btn-primary { background: var(--rust); color: var(--paper); }
    .btn-primary:hover:not(:disabled) { background: var(--rust-deep); }
    .btn-ghost { background: var(--paper-deep); color: var(--ink); border: 1px solid var(--divider); }
    .btn-ghost:hover:not(:disabled) { background: var(--divider); }

    .toggle-label { display: flex; align-items: center; gap: 7px; font-size: 0.8rem; color: var(--muted); cursor: pointer; white-space: nowrap; }
    .toggle-label input[type="checkbox"] { accent-color: var(--rust); cursor: pointer; }

    select {
      font-family: var(--font);
      background: var(--paper-deep); color: var(--ink); border: 1px solid var(--divider);
      border-radius: var(--radius); padding: 7px 10px; font-size: 0.82rem; cursor: pointer; outline: none;
    }
    select:hover { border-color: var(--rust); }

    /* ── Analysis section ── */
    #analysisSection {
      display: none;
      flex-direction: column;
      width: 100%;
      max-width: 900px;
      gap: 14px;
    }

    .analysis-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 8px;
    }
    .analysis-header h2 { font-size: 1rem; font-weight: 700; color: var(--ink); }

    .analysis-mode-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: var(--radius);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .analysis-mode-badge.drill   { background: rgba(160,68,44,0.1); color: var(--rust-deep); border: 1px solid rgba(160,68,44,0.3); }
    .analysis-mode-badge.injury  { background: rgba(26,26,26,0.06); color: var(--ink); border: 1px solid var(--divider); }

    /* ── Drill mode: simple video preview, no tracking/skeleton UI ── */
    #videoWrap.drill-mode #selectionControls,
    #videoWrap.drill-mode #redrawCropBtn,
    #videoWrap.drill-mode .toggle-label {
      display: none !important;
    }

    .context-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .context-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0 2px;
    }
    .context-row textarea {
      width: 100%;
      resize: vertical;
      min-height: 64px;
      background: var(--paper-deep);
      border: 1.5px solid var(--divider);
      border-radius: var(--radius);
      padding: 14px 16px;
      color: var(--ink);
      font-size: 0.88rem;
      font-family: var(--font);
      line-height: 1.5;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .context-row textarea:focus { border-color: var(--rust); box-shadow: 0 0 0 3px rgba(160,68,44,0.1); }
    .context-row textarea::placeholder { color: var(--muted); opacity: 0.6; }

    .btn-analyze {
      align-self: flex-start;
      padding: 11px 28px;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      border-radius: var(--radius);
    }

    /* ── Route-drawing loader (replaces all spinners) ── */
    .analyzing {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 36px 28px;
      color: var(--muted);
      font-size: 0.85rem;
      background: var(--paper-deep);
      border: 1px solid var(--divider);
      border-radius: var(--radius);
    }
    .route-loader { width: 46px; height: 46px; flex-shrink: 0; }
    .route-loader .route-line {
      fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 230; stroke-dashoffset: 230;
      animation: routeDraw 2s ease-in-out infinite;
    }
    .route-loader .route-arrow {
      fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round;
      opacity: 0;
      animation: routeArrow 2s ease-in-out infinite;
    }
    @keyframes routeDraw {
      0%       { stroke-dashoffset: 230; }
      62%,100% { stroke-dashoffset: 0; }
    }
    @keyframes routeArrow {
      0%,60%  { opacity: 0; }
      72%,100% { opacity: 1; }
    }

    /* ── Tick-mark section divider ── */
    .tick-divider {
      height: 10px;
      background-image: repeating-linear-gradient(
        to right, var(--divider) 0, var(--divider) 1.5px, transparent 1.5px, transparent 16px
      );
      background-position: center;
      background-repeat: repeat-x;
      background-size: 100% 10px;
      opacity: 0.9;
    }

    /* ── Report cards ── */
    #reportSection {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .report-error {
      padding: 24px;
      color: var(--flag);
      font-size: 0.85rem;
      background: var(--paper-deep);
      border: 1px solid var(--divider);
      border-radius: var(--radius);
    }

    /* Aliveness hero card */
    .aliveness-card {
      background: var(--paper-deep);
      border: 1px solid var(--divider);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .aliveness-card-inner {
      display: flex;
      align-items: stretch;
      min-height: 160px;
    }
    .aliveness-score-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 40px;
      min-width: 180px;
      border-right: 1px solid var(--divider);
      background: var(--paper);
    }
    .aliveness-number {
      font-size: 96px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
    }
    .aliveness-number.score-high   { color: var(--success); }
    .aliveness-number.score-mid    { color: var(--warn); }
    .aliveness-number.score-low    { color: var(--flag); }
    .aliveness-denom {
      font-size: 1rem;
      color: var(--muted);
      margin-top: 2px;
      font-weight: 500;
    }
    .aliveness-meta-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
      padding: 28px 32px;
    }
    .aliveness-verdict {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .aliveness-verdict.verdict-high   { color: var(--success); }
    .aliveness-verdict.verdict-mid    { color: var(--warn); }
    .aliveness-verdict.verdict-low    { color: var(--flag); }
    .dead-drill-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: var(--radius);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      width: fit-content;
    }
    .dead-drill-pill.is-dead { background: rgba(140,59,39,0.1); color: var(--flag); border: 1px solid rgba(140,59,39,0.3); }
    .dead-drill-pill.is-alive { background: rgba(92,122,74,0.1); color: var(--success); border: 1px solid rgba(92,122,74,0.3); }
    .aliveness-score-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Persistent injury-prevention disclaimer (always rendered, never depends on model output) ── */
    .disclaimer-banner {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 18px;
      background: rgba(160,68,44,0.06);
      border: 1px solid rgba(160,68,44,0.25);
      border-radius: var(--radius);
      font-size: 0.8rem;
      line-height: 1.55;
      color: var(--ink);
    }
    .disclaimer-banner .disclaimer-icon { font-size: 1.05rem; flex-shrink: 0; line-height: 1.3; }
    .disclaimer-banner strong { color: var(--rust-deep); font-weight: 700; }

    /* Standard report card */
    .report-card {
      background: var(--paper-deep);
      border: 1px solid var(--divider);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .report-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 20px;
      background: var(--paper);
      border-bottom: 1px solid var(--divider);
    }
    .report-card-header-icon { font-size: 0.9rem; }
    .report-card-header-title {
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .report-card.card-flag    { border-left: 3px solid var(--flag); }
    .report-card.card-warn    { border-left: 3px solid var(--warn); }
    .report-card.card-suggest { border-left: 3px solid var(--rust-deep); }
    .report-card.card-success { border-left: 3px solid var(--success); }
    .report-card.card-info    { border-left: 3px solid var(--divider); }
    .report-card.card-opportunity { border-left: 3px solid var(--rust); }
    .report-card.card-flag    .report-card-header-title { color: var(--flag); }
    .report-card.card-warn    .report-card-header-title { color: var(--warn); }
    .report-card.card-suggest .report-card-header-title { color: var(--rust-deep); }
    .report-card.card-success .report-card-header-title { color: var(--success); }
    .report-card.card-info    .report-card-header-title { color: var(--muted); }
    .report-card.card-opportunity .report-card-header-title { color: var(--rust); }

    /* ── Plain-language summary cards get slightly larger type — these are the scannable top 3 ── */
    .report-card.card-plain .report-card-body { font-size: 0.92rem; }
    .report-card.card-plain .report-card-header-title { font-size: 0.74rem; }

    /* ── Detailed framework analysis toggle ── */
    #frameworkDetail {
      background: var(--paper);
      border: 1px solid var(--divider);
      border-radius: var(--radius);
      overflow: hidden;
    }
    #frameworkDetail summary {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 20px;
      cursor: pointer;
      list-style: none;
      user-select: none;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--muted);
    }
    #frameworkDetail summary::-webkit-details-marker { display: none; }
    #frameworkDetail summary .chevron { transition: transform 0.18s; color: var(--rust); }
    #frameworkDetail[open] summary .chevron { transform: rotate(90deg); }
    #frameworkDetail summary:hover { color: var(--ink); }
    #frameworkDetail .framework-body {
      padding: 4px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .framework-card {
      background: var(--paper-deep);
      border: 1px solid var(--divider);
      border-left: 3px solid var(--muted);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .framework-card.fw-flag    { border-left-color: var(--flag); }
    .framework-card.fw-success { border-left-color: var(--success); }
    .framework-card-header {
      padding: 9px 16px;
      font-size: 0.66rem;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--paper);
      border-bottom: 1px solid var(--divider);
    }
    .framework-card-body {
      padding: 14px 18px;
      font-size: 0.8rem;
      line-height: 1.7;
      color: var(--ink);
    }
    .framework-card-body p { margin-bottom: 6px; }
    .framework-card-body p:last-child { margin-bottom: 0; }
    .framework-card-body ul { margin: 6px 0 6px 18px; }
    .framework-card-body li { margin-bottom: 5px; }
    .framework-card-body strong { color: var(--ink); font-weight: 700; }
    .framework-card-body em { color: var(--rust-deep); font-style: normal; font-weight: 500; }

    .report-card-body {
      padding: 18px 22px;
      font-size: 0.85rem;
      line-height: 1.75;
      color: var(--ink);
    }
    .report-card-body p { margin-bottom: 6px; }
    .report-card-body p:last-child { margin-bottom: 0; }
    .report-card-body ul { margin: 6px 0 6px 18px; }
    .report-card-body li { margin-bottom: 5px; }
    .report-card-body strong { color: var(--ink); font-weight: 700; }
    .report-card-body em { color: var(--rust-deep); font-style: normal; font-weight: 500; }
    .report-card-body code { background: var(--paper); padding: 1px 6px; border-radius: 4px; font-family: 'SF Mono', 'Cascadia Code', monospace; font-size: 0.82em; color: var(--rust-deep); }

    /* ── Mobile ── */
    @media (max-width: 480px) {
      body { padding: 20px 12px 60px; gap: 16px; }
      .aliveness-card-inner { flex-direction: column; }
      .aliveness-score-col { border-right: none; border-bottom: 1px solid var(--divider); padding: 24px; }
      .aliveness-number { font-size: 64px; }
      .controls { gap: 8px; }
    }
  </style>
</head>
<body>

  <header>
    <img class="logo-img" id="logoImg" src="/mvmnt-logo.png" alt="The Movement AI"
      onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='block'; document.getElementById('brandSubtitle').style.display='none';">
    <h1 class="logo-fallback" id="logoFallback">The Movement AI</h1>
    <div class="brand-subtitle" id="brandSubtitle">The Movement AI</div>
    <p class="tagline">Claude Opus analysis · Yearby / Ecological Dynamics framework</p>
  </header>

  <!-- Mode selector -->
  <div class="mode-selector-wrap">
    <div class="mode-selector-label">Select analysis mode</div>
    <div class="mode-selector">
      <button class="mode-btn active" data-mode="drill" id="modeDrillBtn">
        <span class="mode-btn-icon">📋</span>
        <span class="mode-btn-title">Drill Analysis</span>
        <span class="mode-btn-desc">Watches the drill footage directly · scores against the Alive Movement Problem Checklist · flags dead drills · suggests constraint manipulations</span>
      </button>
      <button class="mode-btn" data-mode="injury" id="modeInjuryBtn">
        <span class="mode-btn-icon">🩹</span>
        <span class="mode-btn-title">Injury Prevention</span>
        <span class="mode-btn-desc">Screen for asymmetry and movement patterns worth flagging to an athletic trainer · not medical advice</span>
      </button>
    </div>
  </div>

  <div id="uploadArea">
    <svg class="playbook-decoration" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="55" cy="150" r="9" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
      <circle cx="150" cy="168" r="9" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
      <g stroke="var(--ink)" stroke-width="1.5">
        <line x1="330" y1="30" x2="352" y2="52"/>
        <line x1="352" y1="30" x2="330" y2="52"/>
      </g>
      <g stroke="var(--ink)" stroke-width="1.5">
        <line x1="290" y1="140" x2="312" y2="162"/>
        <line x1="312" y1="140" x2="290" y2="162"/>
      </g>
      <path d="M55,141 L55,95 Q55,70 85,64 L120,56" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
      <path d="M110,50 L120,56 L106,64" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M150,159 L175,110 L230,85" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
      <path d="M219,80 L230,85 L221,94" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M245,145 Q270,120 260,95 Q255,80 275,68" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
      <path d="M264,64 L275,68 L270,79" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="icon">🎬</div>
    <p class="label"><strong>Click to upload</strong> or drag &amp; drop a video</p>
    <p class="hint">MP4, MOV, WebM · processed client-side, nothing is stored</p>
    <input type="file" id="fileInput" accept="video/*">
  </div>

  <div id="statusBar">
    <div class="dot loading" id="statusDot"></div>
    <span id="statusText">Loading pose model…</span>
    <span id="trackingBadge"></span>
    <span id="fpsBadge"></span>
  </div>

  <div id="videoWrap">
    <video id="video" playsinline></video>
    <canvas id="outputCanvas"></canvas>
    <div class="controls" id="selectionControls" style="display:none;">
      <button class="btn-ghost" id="useFullFrameBtn">Analyze full frame</button>
    </div>
    <div class="seek-row">
      <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1">
      <span id="timeDisplay">0:00 / 0:00</span>
    </div>
    <div class="controls">
      <button class="btn-primary" id="playPauseBtn">Pause</button>
      <button class="btn-ghost"    id="restartBtn">Restart</button>
      <button class="btn-ghost"    id="redrawCropBtn">🎯 Redraw crop box</button>
      <select id="speedSelect" title="Playback speed">
        <option value="0.1">0.1×</option>
        <option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="1.5">1.5×</option>
        <option value="2">2×</option>
      </select>
      <label class="toggle-label"><input type="checkbox" id="showVideo" checked> Show video</label>
      <label class="toggle-label"><input type="checkbox" id="showSkeleton" checked> Skeleton</label>
    </div>
  </div>

  <div id="analysisSection">
    <div class="analysis-header">
      <div style="display:flex;align-items:center;gap:10px;">
        <h2 id="analysisTitle">Drill Analysis</h2>
        <span class="analysis-mode-badge drill" id="analysisModeBadge">📋 Drill</span>
      </div>
    </div>
    <div class="context-row">
      <label class="context-label" for="movementContextInput">Context / Description</label>
      <textarea id="movementContextInput" rows="2"
        placeholder="Describe the drill (optional) — e.g., pass-rush 1v1, defensive end stance &amp; start, WR route running on air…"></textarea>
    </div>
    <button class="btn-primary btn-analyze" id="analyzeBtn">🔎 Analyze</button>
    <div id="reportSection"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js" crossorigin="anonymous"></script>
  <script>
    /* === State === */
    let currentMode = 'drill';

    /* === Mode selector === */
    const modeDrillBtn     = document.getElementById('modeDrillBtn');
    const modeInjuryBtn    = document.getElementById('modeInjuryBtn');
    const analysisTitle    = document.getElementById('analysisTitle');
    const analysisModeBadge = document.getElementById('analysisModeBadge');
    const movementContextInput = document.getElementById('movementContextInput');

    const MODE_META = {
      drill: {
        title: 'Drill Analysis',
        badge: '📋 Drill',
        placeholder: 'Describe the drill (optional) — e.g., pass-rush 1v1, defensive end stance & start, WR route running on air…',
      },
      injury: {
        title: 'Injury Prevention',
        badge: '🩹 Injury Prevention',
        placeholder: 'Describe the session (optional) — e.g., post-practice screen, returning from tightness, general movement check…',
      },
    };

    // Switching modes after a video is already loaded resets back to the upload screen rather than
    // leaving the mode buttons in a dead-end disabled state — the two modes now use completely
    // different pipelines (frame-sampling vs. MediaPipe tracking), so there's no safe way to carry
    // an in-progress video across a mode switch.
    function setMode(mode) {
      if (video.src && mode !== currentMode) resetToUploadState();
      currentMode = mode;
      modeDrillBtn.classList.toggle('active', mode === 'drill');
      modeInjuryBtn.classList.toggle('active', mode === 'injury');
      movementContextInput.placeholder = MODE_META[mode].placeholder;
      analysisTitle.textContent = MODE_META[mode].title;
      analysisModeBadge.textContent = MODE_META[mode].badge;
      analysisModeBadge.className = `analysis-mode-badge ${mode}`;
    }

    modeDrillBtn.addEventListener('click', () => setMode('drill'));
    modeInjuryBtn.addEventListener('click', () => setMode('injury'));

    /* === DOM refs === */
    const statusDot    = document.getElementById('statusDot');
    const statusText   = document.getElementById('statusText');
    const fpsBadge     = document.getElementById('fpsBadge');
    const trackingBadge = document.getElementById('trackingBadge');
    const video        = document.getElementById('video');
    const canvas       = document.getElementById('outputCanvas');
    const ctx          = canvas.getContext('2d');
    const videoWrap    = document.getElementById('videoWrap');
    const fileInput    = document.getElementById('fileInput');
    const uploadArea   = document.getElementById('uploadArea');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const restartBtn   = document.getElementById('restartBtn');
    const redrawCropBtn = document.getElementById('redrawCropBtn');
    const speedSelect  = document.getElementById('speedSelect');
    const seekBar      = document.getElementById('seekBar');
    const timeDisplay  = document.getElementById('timeDisplay');
    const showVideoChk    = document.getElementById('showVideo');
    const showSkeletonChk = document.getElementById('showSkeleton');
    const analysisSection = document.getElementById('analysisSection');
    const reportSection   = document.getElementById('reportSection');
    const analyzeBtn      = document.getElementById('analyzeBtn');
    const selectionControls = document.getElementById('selectionControls');
    const useFullFrameBtn = document.getElementById('useFullFrameBtn');

    /* === MediaPipe === */
    let lastResults  = null;
    let isProcessing = false;
    let fpsCount = 0;
    let fpsTimer = Date.now();
    let rafId    = null;

    /* === Person detection / selection === */
    const personModelPromise = cocoSsd.load();
    let detectedBoxes    = [];   // [{x,y,width,height,index}] in video pixel space
    let awaitingSelection = false;
    let manualCropMode    = false;
    let dragStart         = null; // {x,y} in video pixel space, while dragging a manual crop box
    let dragCurrent       = null;
    let cropRect          = null; // {x,y,width,height} in video pixel space, or null = full frame
    const cropCanvas = document.createElement('canvas');
    const cropCtx    = cropCanvas.getContext('2d');

    /* === Cross-frame tracking === */
    const searchCanvas = document.createElement('canvas');
    const searchCtx    = searchCanvas.getContext('2d');
    let isTracking      = false;
    let trackingLost    = false;
    let lastTrackTime    = 0;
    const TRACK_INTERVAL_MS  = 600;
    const TRACK_SEARCH_SCALE = 2.2;

    /* === Tracking uncertainty & manual redraw === */
    let redrawActive  = false;   // true whenever the user is mid-redraw (button or auto-triggered)
    let redrawTrigger = null;    // 'user' | 'auto'
    let previousBoxForLog = null; // cropRect snapshot taken right before a redraw begins
    let missedTrackingCount     = 0; // consecutive periodic tracking checks that found nobody / jumped erratically
    let consecutiveNoPoseFrames = 0; // consecutive render frames where MediaPipe found no pose
    const MAX_MISSED_TRACKING = 2;   // ~2 tracking intervals (~1.2s) of lost/erratic tracking
    const MAX_NO_POSE_FRAMES  = 45;  // ~1.5s at 30fps with no detected pose
    const ERRATIC_JUMP_FACTOR = 1.8; // new center moving further than this * old box diagonal = suspicious

    const pose = new Pose({
      locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      enableSegmentation: false,
      smoothSegmentation: false,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5,
    });

    pose.onResults(results => {
      isProcessing = false;
      lastResults  = results;
      if (results.poseLandmarks) {
        collectAngles(results.poseLandmarks);
        consecutiveNoPoseFrames = 0;
      } else if (cropRect) {
        // Only counts as a tracking-uncertainty signal while tracking a specific person —
        // full-frame mode with nobody visible isn't a "lost the athlete" situation.
        consecutiveNoPoseFrames++;
        maybeAutoPauseForUncertainty();
      }
      fpsCount++;
      const now = Date.now();
      if (now - fpsTimer >= 1000) {
        fpsBadge.textContent = `${fpsCount} fps`;
        fpsCount = 0;
        fpsTimer = now;
      }
    });

    Promise.all([pose.initialize(), personModelPromise]).then(() => {
      statusDot.className = 'dot ready';
      statusText.textContent = 'Models ready — select a mode and upload a video';
    }).catch(err => {
      statusDot.className = 'dot error';
      statusText.textContent = `Failed to load model: ${err.message}`;
    });

    /* === Render loop === */
    function remapLandmarksToCanvas(landmarks, crop, W, H) {
      return landmarks.map(lm => ({
        ...lm,
        x: (crop.x + lm.x * crop.width)  / W,
        y: (crop.y + lm.y * crop.height) / H,
      }));
    }

    function expandRect(rect, factor, maxW, maxH) {
      const cx = rect.x + rect.width  / 2;
      const cy = rect.y + rect.height / 2;
      const width  = Math.min(maxW, rect.width  * factor);
      const height = Math.min(maxH, rect.height * factor);
      const x = Math.max(0, Math.min(maxW - width,  cx - width  / 2));
      const y = Math.max(0, Math.min(maxH - height, cy - height / 2));
      return { x, y, width, height };
    }

    // Re-run person detection within an expanded search area around the last known position,
    // roughly every TRACK_INTERVAL_MS of playback, to keep the crop region on the selected athlete
    // as they move. Lightweight and imperfect by design: if nobody is found nearby, we simply keep
    // the last known cropRect rather than losing track entirely.
    async function updateTracking() {
      if (isTracking || !cropRect) return;
      isTracking = true;
      try {
        const searchRect = expandRect(cropRect, TRACK_SEARCH_SCALE, video.videoWidth, video.videoHeight);
        searchCanvas.width  = searchRect.width;
        searchCanvas.height = searchRect.height;
        searchCtx.drawImage(video, searchRect.x, searchRect.y, searchRect.width, searchRect.height, 0, 0, searchRect.width, searchRect.height);

        const model = await personModelPromise;
        const preds = await model.detect(searchCanvas);
        const people = preds.filter(p => p.class === 'person' && p.score > 0.4);

        if (people.length > 0) {
          const prevCx = cropRect.x + cropRect.width / 2;
          const prevCy = cropRect.y + cropRect.height / 2;
          const prevDiag = Math.hypot(cropRect.width, cropRect.height);
          let best = null, bestDist = Infinity;
          for (const p of people) {
            const bx = searchRect.x + p.bbox[0], by = searchRect.y + p.bbox[1];
            const cx = bx + p.bbox[2] / 2, cy = by + p.bbox[3] / 2;
            const dist = (cx - prevCx) ** 2 + (cy - prevCy) ** 2;
            if (dist < bestDist) { bestDist = dist; best = { x: bx, y: by, width: p.bbox[2], height: p.bbox[3] }; }
          }
          const jumpDist = Math.sqrt(bestDist);
          const erratic = jumpDist > prevDiag * ERRATIC_JUMP_FACTOR;
          cropRect = computeCropRect(best);
          trackingLost = false;
          missedTrackingCount = erratic ? missedTrackingCount + 1 : 0;
        } else {
          trackingLost = true; // keep the last known cropRect — graceful degradation, not a crash
          missedTrackingCount++;
        }
        maybeAutoPauseForUncertainty();
      } catch (err) {
        console.error('Tracking update failed:', err.message);
        trackingLost = true;
      } finally {
        isTracking = false;
      }
    }

    function maybeAutoPauseForUncertainty() {
      if (awaitingSelection) return; // already paused/redrawing — don't double-trigger
      if (missedTrackingCount >= MAX_MISSED_TRACKING || consecutiveNoPoseFrames >= MAX_NO_POSE_FRAMES) {
        missedTrackingCount = 0;
        consecutiveNoPoseFrames = 0;
        beginRedraw('auto');
      }
    }

    // Drill mode just mirrors the video onto the canvas for preview (no ML calls at all — frame
    // sampling happens on demand when Analyze is clicked). Injury mode keeps the full MediaPipe
    // pose + person-tracking pipeline, unchanged from prior sessions.
    function renderFrame() {
      const W = video.videoWidth  || 640;
      const H = video.videoHeight || 360;
      if (canvas.width  !== W) canvas.width  = W;
      if (canvas.height !== H) canvas.height = H;
      ctx.clearRect(0, 0, W, H);
      if (currentMode !== 'injury' || showVideoChk.checked) {
        ctx.drawImage(video, 0, 0, W, H);
      } else {
        ctx.fillStyle = '#1A1A1A';
        ctx.fillRect(0, 0, W, H);
      }

      if (currentMode === 'injury') {
        if (cropRect) {
          ctx.strokeStyle = trackingLost ? 'rgba(166,121,15,0.7)' : 'rgba(92,122,74,0.5)';
          ctx.lineWidth = Math.max(1, W * 0.002);
          ctx.strokeRect(cropRect.x, cropRect.y, cropRect.width, cropRect.height);
        }
        if (showSkeletonChk.checked && lastResults?.poseLandmarks) {
          const drawLm = cropRect ? remapLandmarksToCanvas(lastResults.poseLandmarks, cropRect, W, H) : lastResults.poseLandmarks;
          drawConnectors(ctx, drawLm, POSE_CONNECTIONS, { color: '#00E5FF', lineWidth: 2 });
          drawLandmarks(ctx, drawLm, { color: '#FF5722', fillColor: '#FF572280', lineWidth: 1, radius: 4 });
        }
        trackingBadge.textContent = trackingLost ? '⚠ tracking uncertain' : '';
        if (!isProcessing && !video.paused && !video.ended) {
          isProcessing = true;
          if (cropRect) {
            cropCanvas.width  = cropRect.width;
            cropCanvas.height = cropRect.height;
            cropCtx.drawImage(video, cropRect.x, cropRect.y, cropRect.width, cropRect.height, 0, 0, cropRect.width, cropRect.height);
            pose.send({ image: cropCanvas });
          } else {
            pose.send({ image: video });
          }
        }
        if (cropRect && !awaitingSelection && !video.paused && !video.ended) {
          const now = performance.now();
          if (now - lastTrackTime > TRACK_INTERVAL_MS) {
            lastTrackTime = now;
            updateTracking(); // fire-and-forget — must not block the render loop
          }
        }
      }
      rafId = requestAnimationFrame(renderFrame);
    }

    /* === Person detection & selection === */
    function computeCropRect(box) {
      const padX = box.width  * 0.25;
      const padY = box.height * 0.2;
      const x = Math.max(0, box.x - padX);
      const y = Math.max(0, box.y - padY);
      const width  = Math.min(video.videoWidth  - x, box.width  + padX * 2);
      const height = Math.min(video.videoHeight - y, box.height + padY * 2);
      return { x, y, width, height };
    }

    function setControlsEnabled(enabled) {
      playPauseBtn.disabled  = !enabled;
      restartBtn.disabled    = !enabled;
      seekBar.disabled       = !enabled;
      redrawCropBtn.disabled = !enabled;
    }

    // Canvas fillStyle/strokeStyle can't reference CSS custom properties directly, so these mirror
    // the --rust and --success values from the design system by literal hex.
    function drawPersonSelectionOverlay() {
      const W = video.videoWidth, H = video.videoHeight;
      canvas.width = W; canvas.height = H;
      ctx.clearRect(0, 0, W, H);
      ctx.drawImage(video, 0, 0, W, H);
      detectedBoxes.forEach(box => {
        ctx.strokeStyle = '#A0442C';
        ctx.lineWidth = Math.max(2, W * 0.004);
        ctx.strokeRect(box.x, box.y, box.width, box.height);
        const label = `Person ${box.index}`;
        ctx.font = `bold ${Math.max(16, Math.round(W * 0.02))}px Cambria, Georgia, serif`;
        const textW = ctx.measureText(label).width;
        const boxH = Math.max(20, Math.round(W * 0.028));
        ctx.fillStyle = '#A0442C';
        ctx.fillRect(box.x, Math.max(0, box.y - boxH), textW + 16, boxH);
        ctx.fillStyle = '#F5EFE4';
        ctx.fillText(label, box.x + 8, Math.max(boxH - 6, box.y - 7));
      });
      if (manualCropMode && dragStart && dragCurrent) {
        const x = Math.min(dragStart.x, dragCurrent.x);
        const y = Math.min(dragStart.y, dragCurrent.y);
        const w = Math.abs(dragCurrent.x - dragStart.x);
        const h = Math.abs(dragCurrent.y - dragStart.y);
        ctx.strokeStyle = '#5C7A4A';
        ctx.lineWidth = Math.max(2, W * 0.004);
        ctx.setLineDash([10, 6]);
        ctx.strokeRect(x, y, w, h);
        ctx.setLineDash([]);
      }
    }

    function enterSelectionMode(message) {
      awaitingSelection = true;
      canvas.classList.add('awaiting-selection');
      setControlsEnabled(false);
      selectionControls.style.display = 'flex';
      statusText.textContent = message;
      drawPersonSelectionOverlay();
    }

    function exitSelectionMode() {
      awaitingSelection = false;
      manualCropMode = false;
      dragStart = null;
      dragCurrent = null;
      canvas.classList.remove('awaiting-selection');
      selectionControls.style.display = 'none';
    }

    function beginTrackedPlayback(message = 'Processing video…') {
      setControlsEnabled(true);
      statusDot.className = 'dot active';
      statusText.textContent = message;
      playPauseBtn.textContent = 'Pause';
      trackingLost = false;
      missedTrackingCount = 0;
      consecutiveNoPoseFrames = 0;
      lastTrackTime = performance.now();
      video.play().catch(() => {});
      if (!rafId) renderFrame();
    }

    // Fire-and-forget: silently logs a correction event to the backend for future improvement.
    // Never blocks the UI and never surfaces errors to the user.
    function logCorrection(previousBox, newBox, trigger) {
      fetch('/api/log-correction', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          frameTime: video.currentTime,
          previousBox,
          newBox,
          trigger, // 'user' | 'auto'
        }),
      }).catch(err => console.error('Correction log failed (non-blocking):', err.message));
    }

    // Pause and enter manual-drag mode from whatever frame is currently showing, for either a
    // user-initiated redraw or an automatic pause triggered by tracking uncertainty.
    function beginRedraw(trigger) {
      if (awaitingSelection) return; // already mid-selection/redraw — don't double-trigger
      video.pause();
      playPauseBtn.textContent = 'Play';
      previousBoxForLog = cropRect;
      redrawActive = true;
      redrawTrigger = trigger;
      detectedBoxes = [];
      manualCropMode = true;
      awaitingSelection = true;
      canvas.classList.add('awaiting-selection');
      setControlsEnabled(false);
      selectionControls.style.display = 'none';
      statusText.textContent = trigger === 'auto'
        ? 'Tracking uncertain — please redraw the box around the athlete you want to analyze'
        : 'Drag a new box around the athlete you want to track';
      drawPersonSelectionOverlay();
    }

    redrawCropBtn.addEventListener('click', () => {
      if (!video.src || redrawCropBtn.disabled) return;
      beginRedraw('user');
    });

    function selectPerson(box) {
      exitSelectionMode();
      cropRect = computeCropRect(box);
      detectedBoxes = [];
      beginTrackedPlayback();
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // Draw the current video frame to the canvas, retrying briefly if the browser hasn't actually
    // decoded/painted a frame yet — 'loadeddata' can fire before pixels are truly readable.
    async function drawPaintableFrame(maxAttempts = 10, delayMs = 100) {
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      for (let i = 0; i < maxAttempts; i++) {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        let hasContent = false;
        for (let p = 0; p < data.length; p += 397) {
          if (data[p] > 10 || data[p + 1] > 10 || data[p + 2] > 10) { hasContent = true; break; }
        }
        if (hasContent) return;
        await sleep(delayMs);
      }
      // proceed with whatever is drawn even if it never resolved — better than hanging forever
    }

    async function runPersonDetection() {
      statusDot.className = 'dot active';
      statusText.textContent = 'Detecting people in frame…';
      // A paused video that has never played can fail to decode/paint any frame at all in some
      // browsers. Force one real decode cycle with a flash play/pause before sampling the frame.
      try {
        await video.play();
        video.pause();
      } catch (err) {
        // ignore — autoplay restrictions etc. drawPaintableFrame() below still retries.
      }
      await drawPaintableFrame();

      let predictions = [];
      try {
        const model = await personModelPromise;
        // Detect against the already-drawn canvas rather than the <video> element directly —
        // more reliable across browsers/GPU backends for reading the current decoded frame.
        predictions = await model.detect(canvas);
      } catch (err) {
        console.error('Person detection failed:', err.message);
      }

      detectedBoxes = predictions
        .filter(p => p.class === 'person' && p.score > 0.5)
        .map((p, i) => ({ x: p.bbox[0], y: p.bbox[1], width: p.bbox[2], height: p.bbox[3], score: p.score, index: i + 1 }));

      if (detectedBoxes.length === 1) {
        selectPerson(detectedBoxes[0]);
      } else if (detectedBoxes.length === 0) {
        enterSelectionMode('No people detected automatically — click "Analyze full frame" to continue, or try a clearer clip');
      } else {
        enterSelectionMode(`${detectedBoxes.length} people detected — click the athlete you want to analyze`);
      }
    }

    function canvasEventToVideoCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width  / rect.width;
      const scaleY = canvas.height / rect.height;
      return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
    }

    canvas.addEventListener('click', e => {
      if (!awaitingSelection || manualCropMode) return;
      const { x, y } = canvasEventToVideoCoords(e);
      const box = detectedBoxes.find(b => x >= b.x && x <= b.x + b.width && y >= b.y && y <= b.y + b.height);
      if (box) selectPerson(box);
    });

    // mousedown/mousemove/mouseup below are the shared drag mechanism used by "Redraw crop box"
    // (manualCropMode is only ever set true by beginRedraw() now — there is no longer a button to
    // enter free-drag mode during the initial person-selection step, only click-to-select there).
    canvas.addEventListener('mousedown', e => {
      if (!awaitingSelection || !manualCropMode) return;
      dragStart = canvasEventToVideoCoords(e);
      dragCurrent = dragStart;
    });

    canvas.addEventListener('mousemove', e => {
      if (!awaitingSelection || !manualCropMode || !dragStart) return;
      dragCurrent = canvasEventToVideoCoords(e);
      drawPersonSelectionOverlay();
    });

    canvas.addEventListener('mouseup', () => {
      if (!awaitingSelection || !manualCropMode || !dragStart || !dragCurrent) return;
      const x = Math.min(dragStart.x, dragCurrent.x);
      const y = Math.min(dragStart.y, dragCurrent.y);
      const width  = Math.abs(dragCurrent.x - dragStart.x);
      const height = Math.abs(dragCurrent.y - dragStart.y);
      dragStart = null;
      dragCurrent = null;
      const MIN_CROP_SIZE = 24; // ignore accidental tiny drags/clicks
      if (width < MIN_CROP_SIZE || height < MIN_CROP_SIZE) {
        drawPersonSelectionOverlay();
        return;
      }
      const newBox = { x, y, width, height, index: 'manual' };
      if (redrawActive) {
        logCorrection(previousBoxForLog, newBox, redrawTrigger);
        redrawActive = false;
        redrawTrigger = null;
        exitSelectionMode();
        cropRect = computeCropRect(newBox);
        beginTrackedPlayback('Tracking resumed — analyzing…');
      } else {
        selectPerson(newBox);
      }
    });

    useFullFrameBtn.addEventListener('click', () => {
      exitSelectionMode();
      cropRect = null;
      detectedBoxes = [];
      beginTrackedPlayback('Analyzing full frame…');
    });

    /* === Video events === */
    let detectionTriggered = false;
    video.addEventListener('loadedmetadata', () => {
      videoWrap.classList.add('visible');
      video.playbackRate = parseFloat(speedSelect.value);
      statusDot.className = 'dot active';
      statusText.textContent = currentMode === 'injury' ? 'Loading video frame…' : 'Loading video…';
    });

    video.addEventListener('loadeddata', async () => {
      if (detectionTriggered) return;
      detectionTriggered = true;
      if (currentMode === 'injury') {
        runPersonDetection();
      } else {
        // Drill mode needs no person detection or tracking at all — just force one real decode
        // cycle so the canvas preview shows an actual frame, then leave the video paused. Frames
        // for analysis are sampled on demand when the user clicks Analyze.
        try { await video.play(); video.pause(); } catch (err) { /* ignore */ }
        await drawPaintableFrame();
        if (!rafId) renderFrame();
        statusDot.className = 'dot ready';
        statusText.textContent = 'Video loaded — add context and click Analyze';
        playPauseBtn.textContent = 'Play';
      }
    });

    video.addEventListener('ended', () => {
      statusDot.className = 'dot ready';
      statusText.textContent = 'Video processed — add context and click Analyze';
      playPauseBtn.textContent = 'Play';
      fpsBadge.textContent = '';
    });

    /* === File upload === */
    function loadVideo(file) {
      if (!file?.type.startsWith('video/')) return;
      reportSection.innerHTML = '';
      analysisSection.style.display = 'flex';
      detectionTriggered = false;
      videoWrap.classList.toggle('drill-mode', currentMode === 'drill');

      if (currentMode === 'injury') {
        resetAngleData();
        lastResults = null;
        detectedBoxes = [];
        cropRect = null;
        isTracking = false;
        trackingLost = false;
        trackingBadge.textContent = '';
        missedTrackingCount = 0;
        consecutiveNoPoseFrames = 0;
        redrawActive = false;
        redrawTrigger = null;
        exitSelectionMode();
        setControlsEnabled(true);
      } else {
        trackingBadge.textContent = '';
        setControlsEnabled(true);
      }

      video.src = URL.createObjectURL(file);
    }

    // Full reset back to the pre-upload screen — used when switching modes after a video is
    // already loaded, since drill and injury use entirely different pipelines.
    function resetToUploadState() {
      video.pause();
      video.removeAttribute('src');
      video.load();
      videoWrap.classList.remove('visible');
      videoWrap.classList.remove('drill-mode');
      analysisSection.style.display = 'none';
      reportSection.innerHTML = '';
      exitSelectionMode();
      detectedBoxes = [];
      cropRect = null;
      isTracking = false;
      trackingLost = false;
      trackingBadge.textContent = '';
      missedTrackingCount = 0;
      consecutiveNoPoseFrames = 0;
      redrawActive = false;
      redrawTrigger = null;
      detectionTriggered = false;
      resetAngleData();
      lastResults = null;
      statusDot.className = 'dot ready';
      statusText.textContent = 'Models ready — select a mode and upload a video';
    }

    uploadArea.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => loadVideo(e.target.files[0]));
    uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('drag-over'); });
    uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('drag-over'));
    uploadArea.addEventListener('drop', e => {
      e.preventDefault();
      uploadArea.classList.remove('drag-over');
      loadVideo(e.dataTransfer.files[0]);
    });

    /* === Playback controls === */
    playPauseBtn.addEventListener('click', () => {
      if (video.paused || video.ended) {
        video.play().catch(() => {});
        playPauseBtn.textContent = 'Pause';
        statusDot.className = 'dot active';
        statusText.textContent = currentMode === 'injury' ? 'Processing video…' : 'Playing…';
        if (!rafId) renderFrame();
      } else {
        video.pause();
        playPauseBtn.textContent = 'Play';
      }
    });

    restartBtn.addEventListener('click', () => {
      if (!video.src) return;
      reportSection.innerHTML = '';
      video.currentTime = 0;
      playPauseBtn.textContent = 'Pause';
      statusDot.className = 'dot active';
      if (currentMode === 'injury') {
        resetAngleData();
        lastResults = null;
        trackingLost = false;
        lastTrackTime = performance.now();
        statusText.textContent = 'Processing video…';
      } else {
        statusText.textContent = 'Playing…';
      }
      video.play().catch(() => {});
      if (!rafId) renderFrame();
    });

    speedSelect.addEventListener('change', () => { video.playbackRate = parseFloat(speedSelect.value); });

    video.addEventListener('timeupdate', () => {
      const cur = video.currentTime, dur = video.duration || 0;
      seekBar.value = dur ? (cur / dur) * 100 : 0;
      timeDisplay.textContent = `${fmt(cur)} / ${fmt(dur)}`;
    });

    seekBar.addEventListener('input', () => {
      if (video.duration) video.currentTime = (seekBar.value / 100) * video.duration;
    });

    function fmt(t) {
      const m = Math.floor(t / 60);
      const s = Math.floor(t % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    /* === Joint angle collection === */
    const angleData = { leftKnee: [], rightKnee: [], leftHip: [], rightHip: [], spine: [] };

    function angleBetween(a, b, c) {
      const bax = a.x - b.x, bay = a.y - b.y, baz = (a.z || 0) - (b.z || 0);
      const bcx = c.x - b.x, bcy = c.y - b.y, bcz = (c.z || 0) - (b.z || 0);
      const dot = bax*bcx + bay*bcy + baz*bcz;
      const mag = Math.sqrt((bax*bax + bay*bay + baz*baz) * (bcx*bcx + bcy*bcy + bcz*bcz));
      if (mag < 1e-9) return null;
      return Math.acos(Math.max(-1, Math.min(1, dot / mag))) * (180 / Math.PI);
    }

    function spineFromVertical(lm) {
      const msx = (lm[11].x + lm[12].x) / 2, msy = (lm[11].y + lm[12].y) / 2;
      const mhx = (lm[23].x + lm[24].x) / 2, mhy = (lm[23].y + lm[24].y) / 2;
      const dx = msx - mhx, dy = msy - mhy;
      const mag = Math.sqrt(dx*dx + dy*dy);
      if (mag < 1e-9) return null;
      return Math.acos(Math.max(-1, Math.min(1, -dy / mag))) * (180 / Math.PI);
    }

    function collectAngles(lm) {
      const lk = angleBetween(lm[23], lm[25], lm[27]);
      const rk = angleBetween(lm[24], lm[26], lm[28]);
      const lh = angleBetween(lm[11], lm[23], lm[25]);
      const rh = angleBetween(lm[12], lm[24], lm[26]);
      const sp = spineFromVertical(lm);
      if (lk !== null) angleData.leftKnee.push(lk);
      if (rk !== null) angleData.rightKnee.push(rk);
      if (lh !== null) angleData.leftHip.push(lh);
      if (rh !== null) angleData.rightHip.push(rh);
      if (sp !== null) angleData.spine.push(sp);
    }

    function resetAngleData() {
      for (const k of Object.keys(angleData)) angleData[k] = [];
    }

    function statOf(arr) {
      if (!arr.length) return null;
      let min = arr[0], max = arr[0], sum = 0;
      for (const v of arr) { if (v < min) min = v; if (v > max) max = v; sum += v; }
      return { min: min.toFixed(1), max: max.toFixed(1), avg: (sum / arr.length).toFixed(1) };
    }

    // Signature loader: a route being drawn on a whiteboard (stem + curved break, arrowhead drawn
    // last). Returned as a markup string since it's injected via innerHTML at each loading state.
    function routeLoaderSVG() {
      return `
        <svg class="route-loader" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path class="route-line" d="M20,85 L20,42 Q20,20 45,15 L72,10" />
          <path class="route-arrow" d="M62,2 L74,9 L63,18" />
        </svg>`;
    }

    /* === Injury Prevention: unchanged from prior sessions (MediaPipe joint-angle data) === */
    async function runInjuryAnalysis() {
      const totalFrames = Math.max(...Object.values(angleData).map(a => a.length));
      if (totalFrames < 5) {
        reportSection.innerHTML = '<p class="report-error">Not enough pose data collected. Ensure the athlete is clearly visible throughout the video.</p>';
        return;
      }

      reportSection.innerHTML = `
        <div class="analyzing">
          ${routeLoaderSVG()}
          Running Injury Prevention with Claude Opus…
        </div>`;

      try {
        const res = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            mode: 'injury',
            duration: video.duration ? `${video.duration.toFixed(1)}s` : 'unknown',
            totalFrames,
            context: movementContextInput.value.trim(),
            angles: {
              leftKnee:  statOf(angleData.leftKnee),
              rightKnee: statOf(angleData.rightKnee),
              leftHip:   statOf(angleData.leftHip),
              rightHip:  statOf(angleData.rightHip),
              spine:     statOf(angleData.spine),
            },
          }),
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
        if (!data.analysis) throw new Error('Empty response from Claude');
        renderReport(data.analysis, data.mode || 'injury');
      } catch (err) {
        reportSection.innerHTML = `<div class="report-error">Analysis failed: ${esc(err.message)}</div>`;
      }
    }

    /* === Drill Analysis: video-frame-based (multimodal), no pose data needed === */
    const frameCanvas = document.createElement('canvas');
    const frameCtx    = frameCanvas.getContext('2d');
    const DRILL_FRAME_COUNT   = 10;
    const DRILL_FRAME_MAX_DIM = 640;
    const DRILL_FRAME_QUALITY = 0.6;

    function captureFrameToDataUrl() {
      const w = video.videoWidth, h = video.videoHeight;
      const scale = Math.min(1, DRILL_FRAME_MAX_DIM / Math.max(w, h));
      const cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
      frameCanvas.width = cw; frameCanvas.height = ch;
      frameCtx.drawImage(video, 0, 0, cw, ch);
      return frameCanvas.toDataURL('image/jpeg', DRILL_FRAME_QUALITY);
    }

    function captureFrameAt(t) {
      return new Promise(resolve => {
        const onSeeked = () => {
          video.removeEventListener('seeked', onSeeked);
          resolve(captureFrameToDataUrl());
        };
        video.addEventListener('seeked', onSeeked);
        video.currentTime = t;
      });
    }

    async function sampleDrillFrames(count = DRILL_FRAME_COUNT) {
      const dur = video.duration;
      if (!dur || !isFinite(dur) || dur <= 0) {
        // Duration unknown/invalid (rare edge case) — fall back to whatever frame is showing now.
        return [captureFrameToDataUrl()];
      }
      const margin = Math.min(0.15, dur * 0.05);
      const start = margin;
      const end = Math.max(margin, dur - margin);
      const frames = [];
      for (let i = 0; i < count; i++) {
        const t = count === 1 ? (start + end) / 2 : start + (end - start) * (i / (count - 1));
        frames.push(await captureFrameAt(t));
      }
      return frames;
    }

    async function runDrillAnalysis() {
      if (!video.src || !video.videoWidth) {
        reportSection.innerHTML = '<p class="report-error">No video loaded.</p>';
        return;
      }

      video.pause();
      playPauseBtn.textContent = 'Play';
      reportSection.innerHTML = `
        <div class="analyzing">
          ${routeLoaderSVG()}
          Sampling video frames…
        </div>`;

      let frames;
      try {
        frames = await sampleDrillFrames();
      } catch (err) {
        reportSection.innerHTML = `<div class="report-error">Failed to sample video frames: ${esc(err.message)}</div>`;
        return;
      }

      reportSection.innerHTML = `
        <div class="analyzing">
          ${routeLoaderSVG()}
          Running Drill Analysis with Claude Opus…
        </div>`;

      try {
        const res = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            mode: 'drill',
            duration: video.duration ? `${video.duration.toFixed(1)}s` : 'unknown',
            context: movementContextInput.value.trim(),
            frames,
          }),
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
        if (!data.analysis) throw new Error('Empty response from Claude');
        renderReport(data.analysis, data.mode || 'drill');
      } catch (err) {
        reportSection.innerHTML = `<div class="report-error">Analysis failed: ${esc(err.message)}</div>`;
      } finally {
        video.currentTime = 0;
        if (!rafId) renderFrame();
      }
    }

    analyzeBtn.addEventListener('click', async () => {
      analyzeBtn.disabled = true;
      try {
        if (currentMode === 'injury') {
          await runInjuryAnalysis();
        } else {
          await runDrillAnalysis();
        }
      } finally {
        analyzeBtn.disabled = false;
      }
    });

    /* === Report renderer === */
    function esc(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function inlineMd(s) {
      return s
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g,     '<em>$1</em>')
        .replace(/`(.+?)`/g,       '<code>$1</code>');
    }

    function bodyToHtml(bodyLines) {
      const out = [];
      let i = 0;
      while (i < bodyLines.length) {
        const line = bodyLines[i];
        if (/^[-*] /.test(line)) {
          const items = [];
          while (i < bodyLines.length && /^[-*] /.test(bodyLines[i])) {
            items.push(`<li>${inlineMd(esc(bodyLines[i].slice(2)))}</li>`);
            i++;
          }
          out.push(`<ul>${items.join('')}</ul>`);
          continue;
        } else if (line.trim() === '') {
          // skip blank
        } else {
          out.push(`<p>${inlineMd(esc(line))}</p>`);
        }
        i++;
      }
      return out.join('');
    }

    /* Top-level plain-language sections (scannable in under 30 seconds) */
    const PLAIN_CARD_STYLES = {
      "what's working":         { cls: 'card-success',    icon: '✅' },
      'what to work on':        { cls: 'card-opportunity', icon: '🎯' },
      'how to change it':       { cls: 'card-suggest',     icon: '🛠️' },
      'what looks solid':       { cls: 'card-success',    icon: '✅' },
      'patterns worth watching': { cls: 'card-opportunity', icon: '👀' },
      'suggested mobility work': { cls: 'card-suggest',     icon: '🤸' },
    };

    /* Section titles that mark the start of the collapsed "deeper analysis" block */
    const DETAIL_SECTION_TITLES = new Set(['detailed framework analysis', 'detailed technical analysis']);

    /* Sub-cards inside the collapsed detail section */
    const FRAMEWORK_CARD_STYLES = {
      'aliveness checklist':               { icon: '✅' },
      'missing information sources':       { icon: '⚠️' },
      'constraint manipulations':          { icon: '🔧' },
      'movement problem':                  { icon: '🎯' },
      'constraints shaping this movement': { icon: '⚙️' },
      'functional assessment':             { icon: '📊' },
      'compensation patterns':             { icon: '⚠️' },
      'joint symmetry data':               { icon: '📐' },
      'movement quality notes':            { icon: '🎥' },
      'compensation indicators':           { icon: '⚠️' },
    };

    const INJURY_DISCLAIMER_HTML = `
      <div class="disclaimer-banner">
        <span class="disclaimer-icon">⚕️</span>
        <div><strong>Not medical advice.</strong> These are general movement observations only, not a diagnosis. Please consult a licensed athletic trainer, physical therapist, or physician with any concerns.</div>
      </div>`;

    const TICK_DIVIDER = '<div class="tick-divider"></div>';

    function renderReport(text, mode) {
      const cards = [];

      /* ── Persistent disclaimer: always rendered for injury mode, independent of model output ── */
      if (mode === 'injury') cards.push(INJURY_DISCLAIMER_HTML);

      /* ── Extract metadata lines for drill mode ── */
      let alivenessScore  = null;
      let isDeadDrill     = null;
      let alivenessVerdict = null;

      const metaLines = [];
      const bodyLines = text.split('\n');
      const remainingLines = [];

      for (const line of bodyLines) {
        const scoreMatch = line.match(/^ALIVENESS_SCORE:\s*(\d+)/i);
        const deadMatch  = line.match(/^DEAD_DRILL:\s*(YES|NO)/i);
        const verdictMatch = line.match(/^ALIVENESS_VERDICT:\s*(.+)/i);

        if (scoreMatch)   { alivenessScore   = parseInt(scoreMatch[1], 10); }
        else if (deadMatch)    { isDeadDrill     = deadMatch[1].toUpperCase() === 'YES'; }
        else if (verdictMatch) { alivenessVerdict = verdictMatch[1].trim(); }
        else               { remainingLines.push(line); }
      }

      /* ── Aliveness hero card (drill mode only) ── */
      if (mode === 'drill' && alivenessScore !== null) {
        const scoreNum   = Math.max(1, Math.min(10, alivenessScore));
        const numCls     = scoreNum >= 8 ? 'score-high' : scoreNum >= 5 ? 'score-mid' : 'score-low';
        const verdictCls = scoreNum >= 8 ? 'verdict-high' : scoreNum >= 5 ? 'verdict-mid' : 'verdict-low';
        const verdictText = alivenessVerdict || (scoreNum >= 8 ? 'HIGHLY ALIVE' : scoreNum >= 5 ? 'PARTIALLY ALIVE' : 'DEAD DRILL');
        const deadPillCls   = isDeadDrill ? 'is-dead' : 'is-alive';
        const deadPillText  = isDeadDrill ? '🚫 Dead Drill' : '✅ Not a Dead Drill';
        const deadPillHtml  = isDeadDrill !== null
          ? `<div class="dead-drill-pill ${deadPillCls}">${deadPillText}</div>` : '';

        cards.push(`
          <div class="aliveness-card">
            <div class="aliveness-card-inner">
              <div class="aliveness-score-col">
                <div class="aliveness-score-label">Aliveness Score</div>
                <div class="aliveness-number ${numCls}">${scoreNum}</div>
                <div class="aliveness-denom">/ 10</div>
              </div>
              <div class="aliveness-meta-col">
                <div class="aliveness-verdict ${verdictCls}">${esc(verdictText)}</div>
                ${deadPillHtml}
              </div>
            </div>
          </div>`);
      }

      /* ── Parse top-level (##) sections from remaining lines ── */
      const sections = [];
      let current = null;

      for (const line of remainingLines) {
        if (/^## /.test(line)) {
          if (current) sections.push(current);
          current = { title: line.slice(3).trim(), lines: [] };
        } else if (current) {
          current.lines.push(line);
        }
      }
      if (current) sections.push(current);

      /* ── Split out the deeper-analysis section (rendered separately, collapsed) ── */
      let frameworkSection = null;
      const plainSections = [];
      for (const sec of sections) {
        if (DETAIL_SECTION_TITLES.has(sec.title.toLowerCase())) frameworkSection = sec;
        else plainSections.push(sec);
      }

      /* ── Render the top 3 (or so) plain-language sections as scannable cards ── */
      for (const sec of plainSections) {
        const key   = sec.title.toLowerCase();
        const style = PLAIN_CARD_STYLES[key] || { cls: 'card-info', icon: '📄' };
        const html  = bodyToHtml(sec.lines);
        if (!html.trim()) continue;

        cards.push(`
          <div class="report-card card-plain ${style.cls}">
            <div class="report-card-header">
              <span class="report-card-header-icon">${style.icon}</span>
              <span class="report-card-header-title">${esc(sec.title)}</span>
            </div>
            <div class="report-card-body">${html}</div>
          </div>`);
      }

      /* ── Fallback: if no sections parsed at all, render plain text (disclaimer, if any, stays) ── */
      if (plainSections.length === 0 && !frameworkSection) {
        cards.push(`<div class="report-card"><div class="report-card-body">${bodyToHtml(remainingLines)}</div></div>`);
        reportSection.innerHTML = cards.join(TICK_DIVIDER);
        return;
      }

      /* ── Render the collapsed deeper-analysis toggle, split into ### sub-cards ── */
      if (frameworkSection) {
        const subsections = [];
        let sub = null;
        for (const line of frameworkSection.lines) {
          if (/^### /.test(line)) {
            if (sub) subsections.push(sub);
            sub = { title: line.slice(4).trim(), lines: [] };
          } else if (sub) {
            sub.lines.push(line);
          } else if (line.trim() !== '') {
            // intro text before the first ### subsection (e.g. Claude's bracket note) — ignore
          }
        }
        if (sub) subsections.push(sub);

        const subCardsHtml = subsections.map(sub => {
          const key = sub.title.toLowerCase();
          let fwCls = '';
          let icon  = (FRAMEWORK_CARD_STYLES[key] || {}).icon || '📚';
          if (key === 'dead drill assessment') {
            fwCls = isDeadDrill === true ? 'fw-flag' : isDeadDrill === false ? 'fw-success' : '';
            icon  = isDeadDrill === true ? '🚫' : isDeadDrill === false ? '✅' : '📋';
          }
          const html = bodyToHtml(sub.lines);
          if (!html.trim()) return '';
          return `
            <div class="framework-card ${fwCls}">
              <div class="framework-card-header">${icon} ${esc(sub.title)}</div>
              <div class="framework-card-body">${html}</div>
            </div>`;
        }).filter(Boolean).join(TICK_DIVIDER);

        cards.push(`
          <details id="frameworkDetail">
            <summary><span class="chevron">▶</span> Show ${esc(frameworkSection.title.toLowerCase())}</summary>
            <div class="framework-body">${subCardsHtml}</div>
          </details>`);
      }

      reportSection.innerHTML = cards.join(TICK_DIVIDER);
    }
  </script>
</body>
</html>
